# ArmadaOS WirePlumber drop-in for the Lenovo Legion Y700 Gen4 (TB322FC).
#
# Installed by device-quirks only for the TB322FC board (ARMADA_DEVICE_ID=
# lenovo-tb322fc) to:
#     /etc/wireplumber/wireplumber.conf.d/90-armada-tb322fc-iris.conf
# (WirePlumber 0.5+; this is SPA-JSON syntax.)
#
# Why this exists:
# On TB322FC the kernel exposes the Qualcomm Iris memory-to-memory codec as
# two V4L2 nodes -- /dev/video0 qcom-iris-decoder and /dev/video1
# qcom-iris-encoder -- both with udev ID_PATH=platform-aa00000.video-codec.
# They are codec devices, not cameras. WirePlumber 0.5.18 stalls during its
# camera probe when the Iris codec's firmware init fails at open (-EINVAL);
# the blocked probe leaves later node-added events (including the ALSA audio
# nodes) unprocessed. Direct ALSA playback works (aplay), but Pulse/PipeWire
# streams failed to link -- the sink existed, yet the default and link hooks
# stayed blocked. Excluding just this bus path from camera enumeration lets
# the probe finish and the audio nodes attach.
#
# Scope: matches only the exact V4L2 bus path "platform-aa00000.video-codec".
# The kernel Iris codec driver stays loaded and the v4l2/libcamera monitors
# keep working for real cameras. This is a camera-enumeration workaround, not
# a video-decode fix.

monitor.v4l2.rules = [
  {
    matches = [
      {
        device.bus-path = "platform-aa00000.video-codec"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
