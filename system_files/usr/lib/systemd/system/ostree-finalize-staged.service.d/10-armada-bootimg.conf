[Unit]
# /boot/efi is the ABL image and /var holds the kShimC inputs/state; the base
# unit already requires /etc, /sysroot and /boot.
RequiresMountsFor=/boot/efi /var

[Service]
# No TimeoutStopSec: OSTree sets 5m per ExecStop, so a value here only shortens it.
# Appended after OSTree's own ExecStop=, so the next-boot image is synced only
# after a staged deployment has finalized successfully. The hook reads the same
# boot-method file as the sync unit: ABL regenerates /KERNEL, kShimC updates
# boot_a through the tested state tool.
ExecStop=/usr/libexec/armada/armada-bootimg-finalize
