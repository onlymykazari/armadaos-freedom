# HiFi use case for the Lenovo Legion Y700 Gen4 (SM8750 + AW88461 speakers + WCD9395).
#
# Capture uses the WCD9395 analog mics: AMIC1 -> ADC1 and AMIC4 -> ADC2, both
# fed to the LPASS TX macro over SoundWire2 (TX SWR_INPUT0/1, i.e. SWR_MIC0/1).
#
# Two things are easy to get wrong here and both are required:
#
#  1. 'ADCn Switch' is the *codec SoundWire port enable*, which is a separate
#     control from the DAPM mixer 'ADCn_MIXER Switch'.  Without it the codec
#     never adds the ADC to its SoundWire port channel mask and the LPASS
#     master captures an idle channel (loud broadband noise).
#  2. The codec's SoundWire channel mask must match what the master expects
#     (2 channels here).  Leaving any of the other ADC/DMIC/MBHC ports enabled
#     shifts the channel alignment and the capture turns into rail-to-rail
#     garbage.  So they are all forced off.
#
# Also note 'ADCn Volume' 0 is a mute (TLV_DB_SCALE mute flag), so it must stay
# above 0 - 12 (= 3 dB) matches the vendor mixer_paths.

SectionVerb {
	EnableSequence [
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"
	EnableSequence [
		cset "name='Left Playback Volume' 950"
		cset "name='Right Playback Volume' 950"
	]
	DisableSequence [
		cset "name='Left Playback Volume' 0"
		cset "name='Right Playback Volume' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones (AMIC1 + AMIC4)"

	EnableSequence [
		# Codec SoundWire capture ports: only the two ADCs we use.
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='DMIC0 Switch' 0"
		cset "name='DMIC1 Switch' 0"
		cset "name='DMIC2 Switch' 0"
		cset "name='DMIC3 Switch' 0"
		cset "name='DMIC4 Switch' 0"
		cset "name='DMIC5 Switch' 0"
		cset "name='DMIC6 Switch' 0"
		cset "name='DMIC7 Switch' 0"
		cset "name='MBHC Switch' 0"

		# AMIC1 -> ADC1, AMIC4 -> ADC2
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC2 MUX' CH2_AMIC4"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC2 Volume' 12"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX1 MODE' ADC_LP"

		# ADC1 -> DEC0 -> SWR_MIC0, ADC2 -> DEC1 -> SWR_MIC1
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
